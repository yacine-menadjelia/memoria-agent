services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria
      POSTGRES_DB: memoria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://memoria:memoria@postgres:5432/memoria
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
